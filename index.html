<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cortinilla TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: Tahoma, Verdana, sans-serif; }
  body.preview { background: #222 repeating-linear-gradient(45deg, #2a2a2a 0 20px, #333 20px 40px); }

  /* ---------- Cortinilla ---------- */
  #lower {
    position: fixed; left: 0; bottom: 6vh; width: 100%;
    pointer-events: none; display: flex; align-items: stretch;
    height: 14vh; min-height: 90px;
    transform: translateX(-110%);
  }
  #lower.in  { animation: slideIn .7s cubic-bezier(.2,.9,.25,1) forwards; }
  #lower.out { animation: slideOut .6s cubic-bezier(.6,0,.8,.4) forwards; }
  @keyframes slideIn  { from { transform: translateX(-110%); } to { transform: translateX(0); } }
  @keyframes slideOut { from { transform: translateX(0); } to { transform: translateX(110%); } }

  /* logo del canal */
  #logo {
    flex: none; width: 14vh; min-width: 90px; margin-left: 3vw; z-index: 3;
    display: flex; align-items: center; justify-content: center; text-align: center;
    color: #fff; font-weight: bold; font-size: 2.4vh; letter-spacing: .05em; text-transform: uppercase;
    background: radial-gradient(circle at 35% 25%, #ffe680 0, #f5a800 45%, #b36b00 100%);
    border: .4vh solid #fff; border-radius: 50%;
    box-shadow: 0 .6vh 1.4vh rgba(0,0,0,.6), inset 0 -.8vh 1.2vh rgba(120,50,0,.5);
    text-shadow: 0 .2vh .3vh rgba(0,0,0,.7);
    align-self: center; height: 14vh; min-height: 90px;
  }

  #bar {
    position: relative; flex: 1; margin-left: -2vh; margin-right: 3vw; z-index: 2;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 3vw 0 4vh; overflow: hidden;
    background: linear-gradient(to bottom, #6fb1ff 0%, #1f5fd1 48%, #0b3a9c 52%, #07245f 100%);
    border: .3vh solid #cfe3ff; border-left: none;
    border-radius: 0 7vh 7vh 0;
    box-shadow: 0 .8vh 1.8vh rgba(0,0,0,.65);
  }
  /* brillo tipo "gloss" de la época */
  #bar::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,.55), rgba(255,255,255,.08));
    pointer-events: none;
  }
  /* destello que cruza la barra */
  #bar::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 12vw; left: -20vw;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.65), transparent);
    transform: skewX(-20deg);
  }
  #lower.in #bar::after { animation: shine 1.1s .6s ease-out forwards; }
  @keyframes shine { to { left: 110%; } }

  #pre {
    position: relative; z-index: 1;
    color: #ffd84a; font-weight: bold; text-transform: uppercase;
    font-size: 2.6vh; letter-spacing: .18em;
    text-shadow: 0 .2vh .3vh rgba(0,0,0,.8);
  }
  #title {
    position: relative; z-index: 1;
    color: #fff; font-weight: bold; font-size: 5.4vh; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: .2vh .3vh .4vh rgba(0,0,0,.85);
  }
  #lower.in #pre, #lower.in #title { animation: fadeUp .5s .5s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(1.2vh); } to { opacity: 1; transform: none; } }

  /* ---------- Panel de control ---------- */
  #panel {
    position: fixed; top: 12px; right: 12px; width: 300px; z-index: 10;
    background: #f0f0f0; border: 2px solid #4a6fb0; border-radius: 6px;
    box-shadow: 0 4px 14px rgba(0,0,0,.5); font-size: 13px; color: #111;
  }
  #panel.hidden { display: none; }
  #panel h1 { margin: 0; padding: 6px 10px; font-size: 13px; color: #fff; background: linear-gradient(#4f86d6, #1c4ea3); border-radius: 4px 4px 0 0; }
  #panel .body { padding: 10px; display: grid; gap: 8px; }
  #panel label { display: grid; gap: 3px; font-weight: bold; }
  #panel input, #panel select, #panel button { font: inherit; padding: 5px; }
  #panel .row { display: flex; gap: 6px; }
  #panel .row button { flex: 1; cursor: pointer; }
  #panel small { color: #555; }
</style>
</head>
<body>

<div id="lower">
  <div id="logo"><span id="logoText">TV</span></div>
  <div id="bar">
    <div id="pre">A continuación</div>
    <div id="title">Título de la serie</div>
  </div>
</div>

<div id="panel">
  <h1>Cortinilla — Panel</h1>
  <div class="body">
    <label>Frase
      <select id="prefix">
        <option>A continuación</option>
        <option>Seguimos con</option>
        <option>Regresamos con</option>
        <option>Más tarde</option>
        <option>Próximamente</option>
        <option>Esta noche</option>
        <option>Estás viendo</option>
      </select>
    </label>
    <label>Serie / programa
      <input id="show" type="text" placeholder="Ej: Los Simpson" autocomplete="off">
    </label>
    <label>Logo del canal
      <input id="logoIn" type="text" value="TV" maxlength="6">
    </label>
    <label>Duración (segundos, 0 = manual)
      <input id="dur" type="number" min="0" value="8">
    </label>
    <div class="row">
      <button id="go">▶ Mostrar (Enter)</button>
      <button id="stop">■ Ocultar (Esc)</button>
    </div>
    <small>H = ocultar/mostrar este panel · P = fondo de prueba</small>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const lower = $('lower'), panel = $('panel');
  let timer = null;

  // recordar preferencias
  try {
    const s = JSON.parse(localStorage.getItem('cortinilla') || '{}');
    if (s.prefix) $('prefix').value = s.prefix;
    if (s.logo) $('logoIn').value = s.logo;
    if (s.dur != null) $('dur').value = s.dur;
  } catch (e) {}
  const save = () => { try { localStorage.setItem('cortinilla', JSON.stringify({ prefix: $('prefix').value, logo: $('logoIn').value, dur: $('dur').value })); } catch (e) {} };

  function show() {
    const name = $('show').value.trim();
    if (!name) { $('show').focus(); return; }
    save();
    clearTimeout(timer);
    $('pre').textContent = $('prefix').value;
    $('title').textContent = name;
    $('logoText').textContent = $('logoIn').value || 'TV';
    // reiniciar la animación
    lower.className = '';
    void lower.offsetWidth;
    lower.className = 'in';
    const d = parseFloat($('dur').value) || 0;
    if (d > 0) timer = setTimeout(hide, d * 1000);
  }
  function hide() {
    clearTimeout(timer);
    if (lower.classList.contains('in')) lower.className = 'out';
  }

  $('go').onclick = show;
  $('stop').onclick = hide;
  document.addEventListener('keydown', e => {
    const typing = ['INPUT', 'SELECT'].includes(document.activeElement.tagName);
    if (e.key === 'Enter') { show(); }
    else if (e.key === 'Escape') { hide(); }
    else if (!typing && e.key.toLowerCase() === 'h') panel.classList.toggle('hidden');
    else if (!typing && e.key.toLowerCase() === 'p') document.body.classList.toggle('preview');
  });

  // ?preview en la URL activa el fondo de prueba
  if (location.search.includes('preview')) document.body.classList.add('preview');
  $('show').focus();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cortinilla TV</title>
<link rel="stylesheet" href="lower.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* el tamaño del texto se adapta al tamaño de la ventana; todo lo demás va en em */
  body { font: clamp(12px, min(1.5vw, 2.1vh), 19px) Tahoma, Verdana, sans-serif; background: #f0f0f0; color: #111; }
  input, select, button, textarea { font: inherit; padding: .45em; }
  button { cursor: pointer; }
  label { display: grid; gap: .25em; font-weight: bold; }
  small { color: #555; font-size: .92em; }
  .row { display: flex; gap: .45em; }
  .row > * { flex: 1; min-width: 0; }

  .app { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 1.1em; height: 100%; padding: .9em; }

  /* ---------- columna izquierda: vista previa y acciones ---------- */
  .left { display: flex; flex-direction: column; gap: .75em; min-height: 0; overflow-y: auto; }
  #previewLabel { display: flex; justify-content: space-between; align-items: baseline; gap: .5em; font-weight: bold; }
  #previewLabel small { font-weight: normal; }
  #preview { aspect-ratio: 16 / 9; width: 100%; flex: none; border: 1px solid #555; border-radius: .25em; cursor: pointer;
             background: #2b2b2b repeating-conic-gradient(#3a3a3a 0 25%, #2b2b2b 0 50%) 0 0 / 1.5em 1.5em; }
  /* botones de acción: siempre visibles al pie de cada pestaña, aunque haya que hacer scroll */
  .actions { position: sticky; bottom: -1em; padding: .6em 0 1em; margin-top: auto; background: #f0f0f0; }
  .btn-go { background: #1f5fd1; color: #fff; border: 1px solid #0b3a9c; }
  #quit { margin-top: auto; }
  .btn-tk { background: #c78a00; color: #fff; border: 1px solid #8a5f00; }

  /* ---------- columna derecha: pestañas ---------- */
  .right { display: flex; flex-direction: column; min-height: 0; }
  .tabbar { display: flex; align-items: flex-end; justify-content: space-between; gap: .5em; border-bottom: .15em solid #4a6fb0; }
  .tabs { display: flex; flex-wrap: wrap; gap: .15em; min-width: 0; }
  .tabbtn { padding: .5em .6em; white-space: nowrap; border: 1px solid #aaa; border-bottom: none; border-radius: .4em .4em 0 0; background: #dcdcdc; font-weight: bold; }
  .tabbtn.active { background: #4a6fb0; color: #fff; border-color: #4a6fb0; }
  .langs { display: flex; gap: .3em; padding-bottom: .3em; }
  .langbtn { padding: .2em .65em; font-weight: bold; background: #e4e4e4; border: 1px solid #999; border-radius: .25em; }
  .langbtn.active { background: #1f5fd1; color: #fff; border-color: #0b3a9c; }

  .tab { display: none; padding: 1em .3em; gap: .9em; align-content: start; overflow-y: auto; flex: 1; min-height: 0; }
  .tab.active { display: grid; }

  /* selector de posición con miniaturas */
  .poswrap { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45em; margin-top: .25em; }
  .posbtn { padding: .3em; background: #e8e8e8; border: .15em solid #aaa; border-radius: .3em; }
  .posbtn.active { border-color: #1f5fd1; background: #dbe7fb; }
  .mini { position: relative; height: 2.4em; background: #333; border-radius: .15em; }
  .mini i { position: absolute; height: .55em; background: #5da0ff; border-radius: .25em; }
  .p-tl i, .p-t i, .p-tr i { top: .3em; }
  .p-bl i, .p-b i, .p-br i { bottom: .3em; }
  .p-t i, .p-b i { left: .3em; right: .3em; }
  .p-tl i, .p-bl i { left: .3em; width: 55%; }
  .p-tr i, .p-br i { right: .3em; width: 55%; }

  /* biblioteca de logos guardados */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(5em, 1fr)); gap: .5em; }
  .logo-item { position: relative; height: 4em; display: flex; align-items: center; justify-content: center; padding: .25em;
               background: #ddd; border: .15em solid #aaa; border-radius: .3em; cursor: pointer; text-align: center; font-size: .9em; color: #555; }
  .logo-item img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .logo-item.active { border-color: #1f5fd1; background: #dbe7fb; }
  .logo-item .del { position: absolute; top: -.5em; right: -.5em; width: 1.6em; height: 1.6em; padding: 0; line-height: 1;
                    display: none; border-radius: 50%; background: #c33; color: #fff; border: 1px solid #800; }
  .logo-item:hover .del { display: block; }
  #logoMsg { color: #b00; min-height: 1.2em; }
  .colors { display: grid; grid-template-columns: repeat(4, 1fr); gap: .6em; }
  .colors label { text-align: center; }
  input[type=color] { width: 100%; height: 2.6em; padding: 0; cursor: pointer; }
  input[type=range] { padding: 0; }
  .check { display: flex; align-items: center; gap: .5em; }
  #prefixCustom, #tkLabelCustom { display: none; margin-top: .3em; }
  textarea { resize: vertical; min-height: 4.5em; }
</style>
</head>
<body>
<div class="app">

  <!-- ===== Izquierda: vista previa + acciones siempre a mano ===== -->
  <aside class="left">
    <div>
      <div id="previewLabel"><span data-i18n="preview"></span><small data-i18n="previewHint"></small></div>
      <div id="preview"></div>
    </div>

    <small data-i18n="hint"></small>
    <button id="quit" data-i18n="quit"></button>
  </aside>

  <!-- ===== Derecha: pestañas ===== -->
  <main class="right">
    <div class="tabbar">
      <div class="tabs">
        <button class="tabbtn" data-tab="titles" data-i18n="tabTitles"></button>
        <button class="tabbtn" data-tab="ticker" data-i18n="tabTicker"></button>
        <button class="tabbtn" data-tab="look" data-i18n="tabLook"></button>
        <button class="tabbtn" data-tab="anim" data-i18n="tabAnim"></button>
        <button class="tabbtn" data-tab="signoff" data-i18n="tabSignoff"></button>
        <button class="tabbtn" data-tab="settings" data-i18n="tabSettings"></button>
      </div>
      <div class="langs">
        <button class="langbtn" id="langEs" title="Español">ES</button>
        <button class="langbtn" id="langEn" title="English">EN</button>
      </div>
    </div>

    <!-- Títulos: lo que cambia con más frecuencia -->
    <section class="tab" id="tab-titles">
      <label><span data-i18n="style"></span><select id="style"></select></label>
      <div>
        <b data-i18n="position"></b>
        <div class="poswrap" id="poswrap">
          <button class="posbtn p-tl" data-pos="tl"><div class="mini p-tl"><i></i></div></button>
          <button class="posbtn p-t"  data-pos="t"><div class="mini p-t"><i></i></div></button>
          <button class="posbtn p-tr" data-pos="tr"><div class="mini p-tr"><i></i></div></button>
          <button class="posbtn p-bl" data-pos="bl"><div class="mini p-bl"><i></i></div></button>
          <button class="posbtn p-b"  data-pos="b"><div class="mini p-b"><i></i></div></button>
          <button class="posbtn p-br" data-pos="br"><div class="mini p-br"><i></i></div></button>
        </div>
      </div>
      <label><span id="lblPrefix"></span>
        <select id="prefix"></select>
        <input id="prefixCustom" type="text" autocomplete="off">
      </label>
      <label><span id="lblName"></span><input id="show" type="text" autocomplete="off"></label>
      <label id="rowSub"><span data-i18n="sub"></span><input id="sub" type="text" autocomplete="off"></label>
      <label><span data-i18n="dur"></span><input id="dur" type="number" min="0" value="8"></label>
      <div class="row actions">
        <button id="go" class="btn-go" data-i18n="go"></button>
        <button id="stop" data-i18n="stop"></button>
      </div>
    </section>

    <!-- Cintillo desplazable -->
    <section class="tab" id="tab-ticker">
      <label><span data-i18n="tkText"></span><textarea id="tkText"></textarea></label>
      <label><span data-i18n="tkLabel"></span>
        <select id="tkLabelSel"></select>
        <input id="tkLabelCustom" type="text" maxlength="24" autocomplete="off">
      </label>
      <label><span data-i18n="tkIcon"></span><select id="tkIcon"></select></label>
      <label><span data-i18n="tkPos"></span><select id="tkPos"></select></label>
      <small data-i18n="tkHint"></small>
      <div class="row actions">
        <button id="tkGo" class="btn-tk" data-i18n="tkShow"></button>
        <button id="tkStop" data-i18n="tkHide"></button>
      </div>
    </section>

    <!-- Colores y logo -->
    <section class="tab" id="tab-look">
      <div class="colors">
        <label><span data-i18n="cBar"></span><input id="cBar" type="color" value="#1f5fd1"></label>
        <label><span data-i18n="cPre"></span><input id="cPre" type="color" value="#ffd84a"></label>
        <label><span data-i18n="cTitle"></span><input id="cTitle" type="color" value="#ffffff"></label>
        <label><span data-i18n="cLogo"></span><input id="cLogo" type="color" value="#f5a800"></label>
      </div>
      <button id="resetColors" data-i18n="resetColors"></button>
      <label><span data-i18n="logoText"></span><input id="logo" type="text" value="TV" maxlength="6"></label>
      <button id="pickLogo" data-i18n="pickLogo"></button>
      <b data-i18n="logoSaved"></b>
      <div class="gallery" id="logoGallery"></div>
      <small id="logoMsg"></small>
    </section>

    <!-- Animación -->
    <section class="tab" id="tab-anim">
      <label><span data-i18n="animIn"></span><select id="animIn"></select></label>
      <label><span data-i18n="animOut"></span><select id="animOut"></select></label>
      <label><span><span data-i18n="speed"></span>: <span id="speedVal"></span></span>
        <input id="speed" type="range" min="0.3" max="2" step="0.1" value="0.7">
      </label>
      <button id="playAnim" data-i18n="playAnim"></button>
    </section>

    <!-- Canal cerrado -->
    <section class="tab" id="tab-signoff">
      <label><span data-i18n="soType"></span><select id="soType"></select></label>
      <label><span data-i18n="soCaption"></span><input id="soCaption" type="text" maxlength="40" autocomplete="off"></label>
      <label><span data-i18n="soSound"></span><select id="soSound"></select></label>
      <div class="row actions">
        <button id="soGo" class="btn-go" data-i18n="soShow"></button>
        <button id="soStop" data-i18n="soHide"></button>
      </div>
      <small data-i18n="soHint"></small>
    </section>

    <!-- Ajustes -->
    <section class="tab" id="tab-settings">
      <label><span data-i18n="display"></span><select id="display"></select></label>
      <small data-i18n="displayHint"></small>
    </section>
  </main>
</div>

<script src="lower.js"></script>
<script>

  // ---------- Idiomas ----------
  const I18N = {

        news: { label: 'Noticiero', prefix: 'Etiqueta', name: 'Titular / nombre', namePh: 'Ej: Juan Pérez',

      fallbackShow: 'Este programa',
      custom: '✏ Personalizada…', customPh: 'Escribe tu propio texto',
      sub: 'Subtítulo (cargo, lugar…)', dur: 'Duración (segundos, 0 = manual)',

      tkIconList: [['', 'Sin ícono'], ['logo', 'Logo del canal'], ['🔴', '🔴 Punto rojo'], ['⚠️', '⚠️ Alerta'], ['🚨', '🚨 Sirena'],
        ['📰', '📰 Noticias'], ['⚡', '⚡ Rayo'], ['🔔', '🔔 Campana'], ['📺', '📺 Televisión']],
      tkPos: 'Posición del cintillo', tkTop: 'Arriba', tkBottom: 'Abajo',
      tkHint: 'El cintillo se queda en pantalla hasta que lo ocultes. Si hay una cortinilla en el mismo lado, se sube para no taparse.',
      cBar: 'Barra', cPre: 'Etiqueta', cTitle: 'Título', cLogo: 'Logo', resetColors: 'Restaurar colores',
      logoText: 'Logo del canal (texto)', pickLogo: '🖼 Añadir imagen de logo…',
      logoSaved: 'Logos guardados (clic para elegir)', logoNone: 'Sin imagen (usa el texto)',
      logoDel: 'Eliminar', logoDelConfirm: '¿Eliminar este logo de la lista?',
      logoFull: 'No se pudo guardar: la lista está llena o sin espacio. Elimina algún logo.',
      animIn: 'Entrada', animOut: 'Salida', speed: 'Velocidad (duración)', playAnim: '▶ Probar en la vista previa',

      animOutList: [['auto', 'Automática (según posición)'], ['left', 'Hacia la izquierda'], ['right', 'Hacia la derecha'],
        ['up', 'Sube'], ['down', 'Baja'], ['fade', 'Desvanecer'], ['zoom', 'Zoom'], ['wipe', 'Barrido (cierre)']],
      display: 'Mostrar en', displayHint: 'Si conectas otro monitor con la app abierta, abre este desplegable para actualizar la lista.',
      screen: 'Pantalla', main: 'principal',
      posNames: { tl: 'Arriba izquierda', t: 'Arriba, ancho completo', tr: 'Arriba derecha', bl: 'Abajo izquierda', b: 'Abajo, ancho completo', br: 'Abajo derecha' }
    },
    en: {
      preview: 'Preview', previewHint: '(click to test in and out)', previewShow: 'Show name',
      grpGraphic: 'Bumper / graphic', grpTicker: 'Scrolling ticker',
      go: '▶ Show (Enter)', stop: '■ Hide (Esc)', tkShow: '▶ Show ticker', tkHide: '■ Hide ticker',

      hint: 'Graphics appear on the chosen screen and never block the mouse. The preview is not visible in the shared screen.',

      soSoundList: [['none', 'No sound'], ['tone', '1 kHz test tone'], ['hiss', 'Static hiss']],
      soShow: '▶ Show screen', soHide: '■ Remove screen',
      soHint: 'Covers the whole chosen screen. The bars carry the logo in the center (the one from Colors & logo). It stays until you remove it.',
      style: 'Style', position: 'Position',
      styles: {
        bumper: { label: 'Series bumper', prefix: 'Phrase', name: 'Show / series', namePh: 'E.g. The Simpsons',

        news: { label: 'News', prefix: 'Tag', name: 'Headline / name', namePh: 'E.g. John Smith',
          phrases: ['Live', 'Breaking news', 'On location', 'Exclusive', 'Special report', 'Interview', 'Recap'] },
        morning: { label: 'Morning show', prefix: 'Tag', name: 'Title / guest', namePh: "E.g. Grandma's recipe",
          phrases: ["On today's show", 'Our guest', 'Recipe of the day', 'Weather', 'Tip of the day', 'Giveaway', 'Cooking'] },
        sponsor: { label: 'Sponsor', prefix: 'Phrase', name: 'Sponsor', namePh: 'E.g. Coca-Cola',
          subLabel: 'Show (for the {show} phrase)',
          phrases: ['This program is sponsored by', '{show} is sponsored by', 'This broadcast is sponsored by', 'Brought to you by', 'Presented by'] }
      },
      fallbackShow: 'This program',
      custom: '✏ Custom…', customPh: 'Type your own text',
      sub: 'Subtitle (role, place…)', dur: 'Duration (seconds, 0 = manual)',
      tkText: 'Ticker text', tkTextPh: 'Type the text that will scroll here…', tkLabel: 'Ticker label',
      tkPhrases: ['Breaking news', 'Urgent', 'Live', 'Alert', 'Sports', 'Weather', 'Business', 'Entertainment'],
      tkIcon: 'Label icon',
      tkIconList: [['', 'No icon'], ['logo', 'Channel logo'], ['🔴', '🔴 Red dot'], ['⚠️', '⚠️ Alert'], ['🚨', '🚨 Siren'],
        ['📰', '📰 News'], ['⚡', '⚡ Bolt'], ['🔔', '🔔 Bell'], ['📺', '📺 Television']],
      tkPos: 'Ticker position', tkTop: 'Top', tkBottom: 'Bottom',
      tkHint: 'The ticker stays on screen until you hide it. A graphic on the same side moves up so they never overlap.',
      cBar: 'Bar', cPre: 'Tag', cTitle: 'Title', cLogo: 'Logo', resetColors: 'Reset colors',
      logoText: 'Channel logo (text)', pickLogo: '🖼 Add logo image…',
      logoSaved: 'Saved logos (click to choose)', logoNone: 'No image (use the text)',
      logoDel: 'Delete', logoDelConfirm: 'Delete this logo from the list?',
      logoFull: 'Could not save: the list is full or out of space. Delete a logo.',
      animIn: 'Enter', animOut: 'Exit', speed: 'Speed (duration)', playAnim: '▶ Test in the preview',
      animInList: [['auto', 'Automatic (by position)'], ['left', 'From the left'], ['right', 'From the right'],
        ['up', 'Rise'], ['down', 'Drop'], ['fade', 'Fade'], ['zoom', 'Zoom'], ['bounce', 'Bounce'], ['wipe', 'Wipe (reveal)']],
      animOutList: [['auto', 'Automatic (by position)'], ['left', 'To the left'], ['right', 'To the right'],
        ['up', 'Rise'], ['down', 'Drop'], ['fade', 'Fade'], ['zoom', 'Zoom'], ['wipe', 'Wipe (close)']],
      display: 'Show on', displayHint: 'If you plug in another monitor while the app is open, open this menu to refresh the list.',
      screen: 'Screen', main: 'main',
      posNames: { tl: 'Top left', t: 'Top, full width', tr: 'Top right', bl: 'Bottom left', b: 'Bottom, full width', br: 'Bottom right' }
    }
  };

  let lang = 'es';
  try { lang = localStorage.getItem('cortinilla-lang') || (navigator.language.startsWith('en') ? 'en' : 'es'); } catch (e) {}
  if (!I18N[lang]) lang = 'es';
  const t = () => I18N[lang];
  const styleKey = () => $('style').value || 'bumper';
  const st = () => t().styles[styleKey()];

  // reconstruye un <select> conservando el valor elegido
  function fillSelect(el, items) {
    const prev = el.value;
    el.innerHTML = items.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
    if (items.some(([v]) => String(v) === prev)) el.value = prev;
  }

  let displaysCache = null;
  function renderDisplays() {
    if (!displaysCache) return;
    fillSelect($('display'), displaysCache.displays.map((d, i) =>
      [d.id, `${t().screen} ${i + 1} (${d.size})${d.primary ? ' - ' + t().main : ''}`]));
    $('display').value = displaysCache.current;
  }

  // textos que dependen del estilo elegido
  function refreshStyle() {
    const s = st();
    $('lblPrefix').textContent = s.prefix;
    $('lblName').textContent = s.name;
    $('show').placeholder = s.namePh;
    fillSelect($('prefix'), [...s.phrases.map((p, i) => [i, p]), ['-1', t().custom]]);
    $('prefixCustom').style.display = $('prefix').value === '-1' ? 'block' : 'none';
    $('rowSub').style.display = styleKey() === 'bumper' ? 'none' : '';
    $('rowSub').firstElementChild.textContent = s.subLabel || t().sub;
  }

  function applyLang() {
    document.documentElement.lang = lang;
    $('langEs').classList.toggle('active', lang === 'es');
    $('langEn').classList.toggle('active', lang === 'en');
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t()[el.dataset.i18n];
      if (typeof v === 'string') el.textContent = v;
    });
    fillSelect($('style'), Object.entries(t().styles).map(([k, s]) => [k, s.label]));
    fillSelect($('animIn'), t().animInList);
    fillSelect($('animOut'), t().animOutList);
    fillSelect($('tkPos'), [['bottom', t().tkBottom], ['top', t().tkTop]]);
    fillSelect($('tkLabelSel'), [...t().tkPhrases.map((p, i) => [i, p]), ['-1', t().custom]]);
    fillSelect($('tkIcon'), t().tkIconList);
    $('tkLabelCustom').placeholder = t().customPh;
    fillSelect($('soType'), t().soTypeList);
    fillSelect($('soSound'), t().soSoundList);
    $('soCaption').placeholder = $('soType').value === 'noise' ? t().soCaptionNoisePh : t().soCaptionDefault;
    $('tkLabelCustom').style.display = $('tkLabelSel').value === '-1' ? 'block' : 'none';
    document.querySelectorAll('.posbtn').forEach(b => { b.title = t().posNames[b.dataset.pos]; });
    $('prefixCustom').placeholder = t().customPh;
    $('tkText').placeholder = t().tkTextPh;
    refreshStyle();
    renderDisplays();
    updatePreview();
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('cortinilla-lang', lang); } catch (e) {}
    applyLang();
  }
  $('langEs').onclick = () => setLang('es');
  $('langEn').onclick = () => setLang('en');

  // ---------- Pestañas ----------
  let tab = 'titles';
  function setTab(name) {
    tab = name;
    document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.tab').forEach(s => s.classList.toggle('active', s.id === 'tab-' + name));
    try { localStorage.setItem('cortinilla-tab', name); } catch (e) {}
    updatePreview();
  }
  document.querySelectorAll('.tabbtn').forEach(b => { b.onclick = () => setTab(b.dataset.tab); });

  // ---------- Posición ----------
  let pos = 'b';
  function setPos(p) {
    pos = p;
    document.querySelectorAll('.posbtn').forEach(b => b.classList.toggle('active', b.dataset.pos === p));
    updatePreview();
  }
  document.querySelectorAll('.posbtn').forEach(b => { b.onclick = () => setPos(b.dataset.pos); });

  $('style').onchange = () => {
    if ($('prefix').value !== '-1') $('prefix').value = '0'; // nuevo estilo → primera frase de su lista
    refreshStyle();
    if ($('prefix').value !== '-1') $('prefix').value = '0';
    updatePreview();
  };
  $('tkLabelSel').onchange = () => {
    $('tkLabelCustom').style.display = $('tkLabelSel').value === '-1' ? 'block' : 'none';
    if ($('tkLabelSel').value === '-1') $('tkLabelCustom').focus();
  };
  $('prefix').onchange = () => {
    $('prefixCustom').style.display = $('prefix').value === '-1' ? 'block' : 'none';
    if ($('prefix').value === '-1') $('prefixCustom').focus();
  };

  // ---------- Datos actuales ----------
  function prefixText() {
    const v = $('prefix').value;
    const raw = v === '-1' ? $('prefixCustom').value.trim() : (st().phrases[Number(v)] || '');
    // en "Auspicio", {serie} / {show} se reemplaza por el campo de la serie
    return raw.replace(/\{(serie|show)\}/gi, $('sub').value.trim() || t().fallbackShow);
  }
  const colors = () => ({ bar: $('cBar').value, pre: $('cPre').value, title: $('cTitle').value, logo: $('cLogo').value });
  const speed = () => parseFloat($('speed').value) || 0.7;

  function currentData() {
    return {
      style: styleKey(), pos,
      prefix: prefixText(),
      name: $('show').value.trim(),
      sub: ['news', 'morning'].includes(styleKey()) ? $('sub').value.trim() : '',
      logo: $('logo').value || 'TV', logoImg,
      colors: colors(),
      animIn: $('animIn').value, animOut: $('animOut').value, speed: speed(),
      dur: parseFloat($('dur').value) || 0
    };
  }
  function tkLabelText() {
    const v = $('tkLabelSel').value;
    return v === '-1' ? $('tkLabelCustom').value.trim() : (t().tkPhrases[Number(v)] || '');
  }
  // ícono de la etiqueta: emoji, o el logo del canal (imagen si la hay, si no su texto)
  function tkIconData() {
    const v = $('tkIcon').value;
    if (!v) return {};
    if (v === 'logo') return logoImg ? { img: logoImg } : { text: $('logo').value || 'TV' };
    return { text: v };
  }
  const currentSignoff = () => {
    const type = $('soType').value;
    const typed = $('soCaption').value.trim();
    return {
      type, logo: $('logo').value || 'TV', logoImg,
      // en las barras, si no escribes nada va el texto de fábrica; en la nieve el texto es opcional
      caption: type === 'noise' ? typed : (typed || t().soCaptionDefault),
      sound: $('soSound').value
    };
  };
  const currentTicker = () => ({ text: $('tkText').value.trim(), label: tkLabelText(), icon: tkIconData(), pos: $('tkPos').value, colors: colors() });

  // ---------- Vista previa ----------
  const stage = $('preview');
  Lower.mount(stage);
  let previewTimers = [];
  const stopPreviewAnim = () => { previewTimers.forEach(clearTimeout); previewTimers = []; };

  function previewData() {
    const d = currentData();
    return { ...d, name: d.name || t().previewShow };
  }
  function updatePreview() {
    stopPreviewAnim();
    Lower.fill(stage, previewData(), 'static');
    const tk = currentTicker();
    if (tk.text) Lower.fillTicker(stage, tk, 'static'); else Lower.clearTicker(stage);
    Lower.previewSignoff(stage, tab === 'signoff' ? currentSignoff() : null);
    $('speedVal').textContent = speed().toFixed(1) + ' s';
    persist();
  }
  // prueba: entrada → pausa → salida → vuelve al estado fijo
  function playPreview() {
    stopPreviewAnim();
    Lower.show(stage, previewData());
    const s = speed();
    previewTimers.push(setTimeout(() => Lower.hide(stage), (s + 1.6) * 1000));
    previewTimers.push(setTimeout(updatePreview, (s + 1.6 + s * 0.85 + 0.4) * 1000));
  }
  stage.onclick = playPreview;
  $('playAnim').onclick = playPreview;
  document.addEventListener('input', updatePreview);
  document.addEventListener('change', updatePreview);

  // ---------- Preferencias ----------
  function persist() {
    try {
      localStorage.setItem('cortinilla', JSON.stringify({
        style: $('style').value, pos, prefix: $('prefix').value, prefixCustom: $('prefixCustom').value,
        logo: $('logo').value, dur: $('dur').value, tkLabelSel: $('tkLabelSel').value, tkLabelCustom: $('tkLabelCustom').value, tkIcon: $('tkIcon').value, tkPos: $('tkPos').value,
        animIn: $('animIn').value, animOut: $('animOut').value, speed: $('speed').value,
        soCaption: $('soCaption').value, soType: $('soType').value, soSound: $('soSound').value
      }));
      localStorage.setItem('cortinilla-colors', JSON.stringify(colors()));
    } catch (e) {}
  }

  const COLORS = { cBar: '#1f5fd1', cPre: '#ffd84a', cTitle: '#ffffff', cLogo: '#f5a800' };
  $('resetColors').onclick = () => { for (const k in COLORS) $(k).value = COLORS[k]; updatePreview(); };

  // ---------- Logos (biblioteca guardada) ----------
  const MAX_LOGOS = 30;
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  let logos = [];      // [{ id, name, data }]
  let logoId = '';     // logo elegido ('' = sin imagen, se usa el texto)
  var logoImg = null;  // data URL del logo elegido

  function saveLogos() {
    try {
      localStorage.setItem('cortinilla-logos', JSON.stringify(logos));
      localStorage.setItem('cortinilla-logo-id', logoId);
      $('logoMsg').textContent = '';
      return true;
    } catch (e) {
      $('logoMsg').textContent = t().logoFull;
      return false;
    }
  }
  try {
    logos = JSON.parse(localStorage.getItem('cortinilla-logos') || '[]');
    logoId = localStorage.getItem('cortinilla-logo-id') || '';
    // migración: versiones anteriores guardaban un solo logo
    const old = localStorage.getItem('cortinilla-logo');
    if (old) {
      let l = logos.find(x => x.data === old);
      if (!l) { l = { id: newId(), name: 'Logo', data: old }; logos.push(l); }
      logoId = l.id;
      localStorage.removeItem('cortinilla-logo');
      saveLogos();
    }
  } catch (e) { logos = []; }

  // imágenes grandes se reducen para no agotar el almacenamiento local
  function shrink(data) {
    if (data.length < 500000) return Promise.resolve(data);
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 512 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.onerror = () => resolve(data);
      img.src = data;
    });
  }

  function renderLogo() {
    const sel = logos.find(l => l.id === logoId);
    if (!sel) logoId = '';
    logoImg = sel ? sel.data : null;

    const gal = $('logoGallery');
    gal.textContent = '';
    const none = document.createElement('div');
    none.className = 'logo-item' + (logoImg ? '' : ' active');
    none.textContent = t().logoNone;
    none.onclick = () => selectLogo('');
    gal.appendChild(none);
    for (const l of logos) {
      const item = document.createElement('div');
      item.className = 'logo-item' + (l.id === logoId ? ' active' : '');
      item.title = l.name;
      const img = document.createElement('img');
      img.src = l.data; img.alt = l.name;
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '×'; del.title = t().logoDel;
      del.onclick = e => { e.stopPropagation(); deleteLogo(l.id); };
      item.onclick = () => selectLogo(l.id);
      item.append(img, del);
      gal.appendChild(item);
    }
    updatePreview();
  }
  function selectLogo(id) { logoId = id; saveLogos(); renderLogo(); }
  function deleteLogo(id) {
    if (!confirm(t().logoDelConfirm)) return;
    logos = logos.filter(l => l.id !== id);
    if (logoId === id) logoId = '';
    saveLogos(); renderLogo();
  }

  $('pickLogo').onclick = async () => {
    const files = await cortinilla.pickLogo();
    for (const f of files || []) {
      const data = await shrink(f.data);
      let l = logos.find(x => x.data === data); // si ya está guardado, solo se elige
      if (!l) {
        if (logos.length >= MAX_LOGOS) { $('logoMsg').textContent = t().logoFull; break; }
        l = { id: newId(), name: f.name, data };
        logos.push(l);
      }
      logoId = l.id;
    }
    saveLogos(); renderLogo();
  };

  // ---------- Pantallas ----------
  async function loadDisplays() {
    displaysCache = await cortinilla.getDisplays();
    renderDisplays();
  }
  $('display').onchange = () => cortinilla.setDisplay(Number($('display').value));
  $('display').onmousedown = loadDisplays;

  // ---------- Mostrar / ocultar ----------
  function show() {
    const d = currentData();
    if (!d.name) { setTab('titles'); $('show').focus(); return; }
    cortinilla.show(d);
  }
  function showTicker() {
    const tk = currentTicker();
    if (!tk.text) { setTab('ticker'); $('tkText').focus(); return; }
    cortinilla.showTicker(tk);
  }
  $('go').onclick = show;
  $('stop').onclick = () => cortinilla.hide();
  $('tkGo').onclick = showTicker;
  $('tkStop').onclick = () => cortinilla.hideTicker();
  $('soType').onchange = () => {
    $('soCaption').placeholder = $('soType').value === 'noise' ? t().soCaptionNoisePh : t().soCaptionDefault;
  };
  $('soGo').onclick = () => cortinilla.showSignoff(currentSignoff());
  $('soStop').onclick = () => cortinilla.hideSignoff();
  $('quit').onclick = () => cortinilla.quit();

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'BUTTON') return; // el botón enfocado ya reacciona a Enter
    if (e.key === 'Escape') cortinilla.hide();
    else if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
      if (tab === 'ticker') showTicker(); else if (tab === 'signoff') cortinilla.showSignoff(currentSignoff()); else show();
    } else if (e.key === 'Enter' && e.ctrlKey) showTicker();
  });

  // ---------- Arranque ----------
  applyLang();
  try {
    const s = JSON.parse(localStorage.getItem('cortinilla') || '{}');
    if (s.style && t().styles[s.style]) { $('style').value = s.style; refreshStyle(); }
    if (s.prefix != null && [...$('prefix').options].some(o => o.value === String(s.prefix))) $('prefix').value = s.prefix;
    if (s.prefixCustom) $('prefixCustom').value = s.prefixCustom;
    $('prefixCustom').style.display = $('prefix').value === '-1' ? 'block' : 'none';
    if (s.logo) $('logo').value = s.logo;
    if (s.dur != null) $('dur').value = s.dur;
    if (s.tkLabelSel != null && [...$('tkLabelSel').options].some(o => o.value === String(s.tkLabelSel))) $('tkLabelSel').value = s.tkLabelSel;
    if (s.tkLabelCustom) $('tkLabelCustom').value = s.tkLabelCustom;
    $('tkLabelCustom').style.display = $('tkLabelSel').value === '-1' ? 'block' : 'none';
    if (s.tkIcon != null && [...$('tkIcon').options].some(o => o.value === s.tkIcon)) $('tkIcon').value = s.tkIcon;
    if (s.tkPos) $('tkPos').value = s.tkPos;
    if (s.animIn) $('animIn').value = s.animIn;
    if (s.animOut) $('animOut').value = s.animOut;
    if (s.speed) $('speed').value = s.speed;
    if (s.soCaption) $('soCaption').value = s.soCaption;
    if (s.soType && [...$('soType').options].some(o => o.value === s.soType)) $('soType').value = s.soType;
    if (s.soSound && [...$('soSound').options].some(o => o.value === s.soSound)) $('soSound').value = s.soSound;
    $('soCaption').placeholder = $('soType').value === 'noise' ? t().soCaptionNoisePh : t().soCaptionDefault;
    if (s.pos) pos = s.pos;
    const c = JSON.parse(localStorage.getItem('cortinilla-colors') || '{}');
    for (const k in COLORS) $(k).value = c[k.replace(/^c/, '').toLowerCase()] || COLORS[k];
    tab = localStorage.getItem('cortinilla-tab') || 'titles';
  } catch (e) {}
  setTab(tab);
  setPos(pos);
  renderLogo();
  loadDisplays();
  $('show').focus();
</script>
</body>
</html>

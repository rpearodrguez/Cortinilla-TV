<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<link rel="stylesheet" href="lower.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  .stage { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="lower.js"></script>
<script>
  const stage = document.getElementById('stage');
  Lower.mount(stage);
  let timer = null;

  cortinilla.onShow(d => {
    clearTimeout(timer);
    Lower.show(stage, d);
    if (d.dur > 0) timer = setTimeout(hide, d.dur * 1000);
  });
  function hide() {
    clearTimeout(timer);
    Lower.hide(stage);
  }
  cortinilla.onHide(hide);

  cortinilla.onTicker(t => Lower.showTicker(stage, t));
  cortinilla.onTickerHide(() => Lower.hideTicker(stage));
</script>
</body>
</html>

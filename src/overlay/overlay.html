<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<link rel="stylesheet" href="../shared/lower.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  .stage { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../shared/lower.js"></script>
<script src="../shared/bridge.js"></script>
<script>
  const stage = document.getElementById('stage');
  Lower.mount(stage);
  Bridge.attach(stage);
</script>
</body>
</html>
